<svg xmlns="http://www.w3.org/2000/svg" viewBox="89.5 110.5 804 804" role="img" aria-label="Adventura">
  <!--
    Primary favicon.

    The viewBox is tighter than the exported artboard on purpose. The glyph
    measures 647x707 inside a 1024 square, so it filled only 69% of it and a
    16px tab rendered roughly 11px of actual letter. Cropping to the glyph plus
    even padding takes that to ~88%, which is most of the legibility available
    at that size.

    The colour adapts rather than compromising. A single value has to survive
    both a near-white and a near-black tab strip, and nothing does that well:
    the brand green reaches only 2.3:1 on a light strip, while anything dark
    enough for white disappears on Brave's dark chrome. Here the light strip
    gets a deepened sage (4.7:1) and the dark strip gets the real brand green
    (7.5:1), so neither is a compromise.

    Browsers without SVG favicon support fall back to favicon.ico, which is the
    light-strip colour since ICO cannot adapt.

    The base colour is a presentation attribute rather than only a CSS rule.
    Not every renderer applies an embedded stylesheet — librsvg does not, and
    with the fill living solely in CSS the path fell back to black, which is
    invisible on a dark tab strip. As an attribute it is the floor every
    renderer gets, and the stylesheet still wins where stylesheets are honoured
    (CSS outranks presentation attributes), so the adaptive behaviour survives
    without depending on it.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      path { fill: #9BB1A1; }
    }
  </style>
  <path fill="#5E7A68" d="M699.756 864.733C611.13 864.733 562.662 801.77 554.354 675.846H375.717C361.869 707.673 350.099 737.424 340.405 765.1L313.402 843.976H168L495.154 159H718.45L762.071 663.391C768.995 736.04 786.304 783.089 814 804.538C793.921 844.668 755.839 864.733 699.756 864.733ZM407.913 600.083H551.238L538.775 333.358V305.336L465.035 468.277L407.913 600.083Z"/>
</svg>
